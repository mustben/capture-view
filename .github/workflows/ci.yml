# No issue/PR text or other untrusted event fields are interpolated into commands.
name: Windows Rust checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Toolchain
        run: |
          cargo --version
      - run: python -m unittest discover -s scripts -p "test_*.py"
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked
      - run: cargo build --release --locked
      - name: Responsive opening cancellation (no capture hardware)
        run: |
          $env:CAPTUREVIEW_TEST_EXE = (Resolve-Path target/release/capture-view.exe).Path
          python scripts/test_opening.py
      - name: Package with dependency licenses
        run: python scripts/package.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: CaptureView-windows-x64-unsigned
          path: dist/*
