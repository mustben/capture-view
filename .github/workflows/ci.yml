# No issue/PR text or other untrusted event fields are interpolated into commands.
name: Windows Rust checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (Node.js 24)
      - name: Toolchain
        run: |
          cargo --version
      - run: python -m unittest discover -s scripts -p "test_*.py"
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked
      - run: cargo build --release --locked
      - name: Responsive opening cancellation (no capture hardware)
        run: |
          $env:CAPTUREVIEW_TEST_EXE = (Resolve-Path target/release/capture-view.exe).Path
          python scripts/test_opening.py
      - name: Package with dependency licenses
        run: python scripts/package.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2 (Node.js 24)
        with:
          name: CaptureView-windows-x64-unsigned
          path: dist/*
